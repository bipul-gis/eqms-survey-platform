<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <meta name="theme-color" content="#0f172a" />
    <title>Geosurvey</title>
    <style>
      .initial-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .initial-preloader-card {
        width: min(272px, calc(100vw - 72px));
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        animation: initial-loader-rise 620ms ease-out both;
      }
      .initial-preloader-card img {
        width: 82%;
        max-height: 58px;
        object-fit: contain;
      }
      .initial-preloader-title {
        margin-top: 18px;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: 0;
      }
      .initial-preloader-bar {
        position: relative;
        width: 168px;
        height: 4px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: #dbeafe;
      }
      .initial-preloader-bar span {
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: #2563eb;
        animation: initial-loader-progress 1200ms ease-in-out infinite;
      }
      @keyframes initial-loader-rise {
        from {
          transform: translateY(12px) scale(0.98);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }
      @keyframes initial-loader-progress {
        from {
          transform: translateX(-115%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-preloader-card,
        .initial-preloader-bar span {
          animation: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div class="initial-preloader" aria-label="Starting Geosurvey">
        <div class="initial-preloader-card">
          <img src="/eqms-logo.png" alt="EQMS" />
        </div>
        <div class="initial-preloader-title">Geosurvey</div>
        <div class="initial-preloader-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
